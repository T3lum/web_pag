<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corpotex | Diseñador</title>
  <link rel="icon" href="assets/logo_corpotex_simbolo.png" />
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --primary: #102a43;
      --primary-2: #1b3e5a;
      --gold: #d9aa3d;
      --muted: #5d6977;
      --border: #e1e7ee;
      --success: #1d7a4f;
      --warn: #b86503;
      --danger: #9a2d2d;
      --shadow: 0 16px 38px rgba(17, 24, 39, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #edf2f9 0%, #f8f9fb 100%);
      color: var(--primary);
    }
    a { color: inherit; text-decoration: none; }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }
    .brand img { width: 34px; height: 34px; border-radius: 10px; }
    .brand small { display: block; color: var(--muted); font-weight: 500; }
    .logout {
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px;
    }
    .login {
      max-width: 420px;
      margin: 30px auto 0;
    }
    .login h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 2vw, 2.3rem);
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.6;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    input, select {
      width: 100%;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #f9fafc;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      padding: 12px 18px;
      font-weight: 700;
      transition: transform .18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
      margin-top: 20px;
    }
    .status {
      margin-top: 16px;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      display: none;
    }
    .status.error { display: block; background: rgba(154,45,45,.08); color: var(--danger); }
    .status.ok { display: block; background: rgba(29,122,79,.08); color: var(--success); }
    .dashboard { display: none; }
    .dashboard.visible { display: block; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h2 { margin: 0; }
    .meta {
      color: var(--muted);
      font-size: 0.95rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #fff;
    }
    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 0.94rem;
    }
    th {
      background: #f6f9ff;
      font-weight: 700;
    }
    tr:last-child td { border-bottom: none; }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #eef4ff;
      color: #2d5aa8;
    }
    .pill.warn { background: rgba(184,101,3,.1); color: var(--warn); }
    .pill.ok { background: rgba(29,122,79,.08); color: var(--success); }
    .pill.bad { background: rgba(154,45,45,.08); color: var(--danger); }
    .small { color: var(--muted); }
    .badge { display: inline-flex; align-items: center; gap: 6px; }
    .muted { color: var(--muted); }
    .status-select {
      min-width: 160px;
      background: #fff;
    }
    .empty {
      background: #f8fafc;
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }
    @media (max-width: 700px) {
      .panel { padding: 20px 16px; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo_corpotex_simbolo.png" alt="Corpotex" />
        <div>
          <span>Corpotex</span>
          <small>Panel del diseñador</small>
        </div>
      </div>
      <a class="btn" href="/" style="background:#eef2ff;color:#102a43;border:1px solid #dfe6f9;">Volver al sitio</a>
    </header>

    <main class="panel login" id="loginView">
      <h1>Acceso del diseñador</h1>
      <p class="subtitle">Ingresa tus credenciales para consultar y gestionar las solicitudes de cambios y revisiones.</p>
      <form id="loginForm">
        <label>
          Usuario
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Ej. diseñador" required />
        </label>
        <label>
          Contraseña
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </label>
        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
      </form>
      <div class="status error" id="loginError" role="alert"></div>
    </main>

    <main class="panel dashboard" id="dashboardView">
      <div class="row">
        <div>
          <h2>Solicitudes del diseñador</h2>
          <div class="meta" id="sessionMeta">Cargando…</div>
        </div>
        <button class="logout" id="logoutBtn" type="button">Cerrar sesión</button>
      </div>
      <div id="requestsContainer"></div>
    </main>
  </div>

  <script>
    const state = { auth: null, requests: [] };

    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const sessionMeta = document.getElementById('sessionMeta');
    const requestsContainer = document.getElementById('requestsContainer');

    function setError(msg) {
      loginError.textContent = msg || '';
      loginError.style.display = msg ? 'block' : 'none';
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        credentials: 'same-origin',
        ...options,
        headers: {
          ...(options.body && !(options.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}),
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) {}

      if (!response.ok) {
        throw new Error((data && data.error) || 'La operación falló.');
      }
      return data;
    }

    function renderStatus(status) {
      const map = {
        'Pendiente de revisión': 'pill warn',
        'En revisión': 'pill warn',
        'Requiere información': 'pill warn',
        'Aprobada': 'pill ok',
        'Rechazada': 'pill bad'
      };
      return `<span class="${map[status] || 'pill'}">${status}</span>`;
    }

    function renderRequests(requests) {
      if (!requests.length) {
        requestsContainer.innerHTML = '<div class="empty">No hay solicitudes registradas todavía.</div>';
        return;
      }

      const rows = requests.map((item) => {
        const customer = item.customer || {};
        const payload = item.payload || {};
        const product = payload.product || item.product || 'Sin producto';
        const quantity = payload.quantity ?? item.quantity ?? '—';
        const note = item.note || payload.note || 'Sin nota del diseñador';
        return `
          <tr>
            <td><strong>${item.id}</strong><div class="small">${new Date(item.created_at).toLocaleString('es-PE')}</div></td>
            <td><strong>${customer.nombre || customer.name || 'Cliente sin nombre'}</strong><div class="small">${customer.empresa || customer.company || 'Sin empresa'}</div></td>
            <td>${product}<div class="small">${quantity} uds.</div></td>
            <td>${payload.type || item.type || 'pedido'}</td>
            <td>${renderStatus(item.status)}</td>
            <td>${note || '—'}</td>
            <td>
              <select class="status-select" data-id="${item.id}">
                <option value="Pendiente de revisión" ${item.status === 'Pendiente de revisión' ? 'selected' : ''}>Pendiente de revisión</option>
                <option value="En revisión" ${item.status === 'En revisión' ? 'selected' : ''}>En revisión</option>
                <option value="Requiere información" ${item.status === 'Requiere información' ? 'selected' : ''}>Requiere información</option>
                <option value="Aprobada" ${item.status === 'Aprobada' ? 'selected' : ''}>Aprobada</option>
                <option value="Rechazada" ${item.status === 'Rechazada' ? 'selected' : ''}>Rechazada</option>
              </select>
            </td>
          </tr>
        `;
      }).join('');

      requestsContainer.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Producto</th>
              <th>Tipo</th>
              <th>Estado</th>
              <th>Nota</th>
              <th>Actualizar</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      document.querySelectorAll('.status-select').forEach((select) => {
        select.addEventListener('change', async (event) => {
          const id = event.target.dataset.id;
          const status = event.target.value;
          try {
            await api(`/api/design-requests/${id}`, {
              method: 'PATCH',
              body: JSON.stringify({ status })
            });
            await loadRequests();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    }

    async function loadRequests() {
      const data = await api('/api/design-requests');
      state.requests = data;
      renderRequests(data);
      sessionMeta.textContent = `Conectado como ${state.auth.username}`;
    }

    async function loadSession() {
      try {
        const data = await api('/api/auth/session');
        state.auth = data;
        if (data.authenticated) {
          loginView.style.display = 'none';
          dashboardView.classList.add('visible');
          await loadRequests();
        } else {
          loginView.style.display = 'block';
          dashboardView.classList.remove('visible');
          sessionMeta.textContent = 'Sin sesión activa';
          requestsContainer.innerHTML = '';
        }
      } catch (error) {
        setError(error.message);
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      setError('');
      try {
        await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        await loadSession();
      } catch (error) {
        setError(error.message);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' });
      await loadSession();
    });

    loadSession();
  </script>
</body>
</html>
